apiVersion: apps/v1
kind: Deployment
metadata:
  name: chav-sim
spec:
  replicas: 1
  selector:
    matchLabels: { app: chav-sim }
  template:
    metadata:
      labels: { app: chav-sim }
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: chav-sim
          image: registry.dennisek.se/chav-sim:bed8bcbca47dc2355ce4363a7a3243c3d71338c1
          ports: [{ containerPort: 3000 }]
          envFrom:
            - secretRef:
                name: chav-sim
---
apiVersion: v1
kind: Service
metadata:
  name: chav-sim
spec:
  selector: { app: chav-sim }
  ports: [{ port: 80, targetPort: 3000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chav-sim
spec:
  ingressClassName: traefik
  rules:
    - host: chav.dennisek.se
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chav-sim
                port: { number: 80 }
