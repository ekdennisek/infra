apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporalt
spec:
  replicas: 1
  selector:
    matchLabels: { app: temporalt }
  template:
    metadata:
      labels: { app: temporalt }
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: temporalt
          image: registry.dennisek.se/temporalt:b9bddbf9e1ff4e3c9ca9b91c724703b7af806661
          ports: [{ containerPort: 3000 }]
          envFrom:
            - secretRef:
                name: temporalt
---
apiVersion: v1
kind: Service
metadata:
  name: temporalt
spec:
  selector: { app: temporalt }
  ports: [{ port: 80, targetPort: 3000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: temporalt
spec:
  ingressClassName: traefik
  rules:
    - host: temporalt.se
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: temporalt
                port: { number: 80 }
