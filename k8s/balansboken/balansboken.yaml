apiVersion: apps/v1
kind: Deployment
metadata:
  name: balansboken
spec:
  replicas: 1
  selector:
    matchLabels: { app: balansboken }
  template:
    metadata:
      labels: { app: balansboken }
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: balansboken
          image: registry.dennisek.se/balansboken:764c81036dcb6b9e72ecc8655f35b07b887c05b2
          ports: [{ containerPort: 3000 }]
          envFrom:
            - secretRef:
                name: balansboken
---
apiVersion: v1
kind: Service
metadata:
  name: balansboken
spec:
  selector: { app: balansboken }
  ports: [{ port: 80, targetPort: 3000 }]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: balansboken-basic-auth
spec:
  basicAuth:
    secret: balansboken-basic-auth
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: balansboken
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: default-balansboken-basic-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: bb.dennisek.se
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: balansboken
                port: { number: 80 }
