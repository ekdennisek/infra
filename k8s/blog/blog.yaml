# S3Storage does not proxy uploads: requests for /content/images/... get a
# 301 to cdnUrl, and new uploads are stored with cdnUrl absolute URLs. The
# `blog` bucket is therefore public, served at blog.static.dennisek.se by
# the Ingress at the bottom via Garage's web endpoint (k8s/common/garage-web).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog
spec:
  replicas: 1
  # One instance only: Ghost runs DB migrations on boot and assumes it is the
  # sole writer, so never let a new pod overlap with the old one.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: blog }
  template:
    metadata:
      labels: { app: blog }
    spec:
      containers:
        - name: blog
          image: ghost:6.62.0-alpine
          ports: [{ containerPort: 2368 }]
          env:
            - { name: url, value: https://blog.dennisek.se }
            - { name: NODE_ENV, value: production }
            - { name: database__client, value: mysql }
            # Images, plus Ghost's separate media (video/audio) and files
            # (downloads) stores, all under content/<type>/ in the bucket, so
            # a plain sync migrates the old instance's content directory.
            - { name: storage__active, value: S3Storage }
            - { name: storage__media__adapter, value: S3Storage }
            - { name: storage__media__staticFileURLPrefix, value: content/media }
            - { name: storage__files__adapter, value: S3Storage }
            - { name: storage__files__staticFileURLPrefix, value: content/files }
            - { name: storage__S3Storage__bucket, value: blog }
            - { name: storage__S3Storage__region, value: garage }
            - { name: storage__S3Storage__endpoint, value: http://10.130.0.20:3900 }
            - { name: storage__S3Storage__forcePathStyle, value: "true" }
            - { name: storage__S3Storage__staticFileURLPrefix, value: content/images }
            - { name: storage__S3Storage__cdnUrl, value: https://blog.static.dennisek.se }
            # Required by the adapter; these are Ghost's documented defaults.
            - { name: storage__S3Storage__multipartUploadThresholdBytes, value: "52428800" }
            - { name: storage__S3Storage__multipartChunkSizeBytes, value: "10485760" }
          envFrom:
            - secretRef:
                name: blog
---
apiVersion: v1
kind: Service
metadata:
  name: blog
spec:
  selector: { app: blog }
  ports: [{ port: 80, targetPort: 2368 }]
---
# TLS ends at the proxy in front of Traefik, which then sees plain HTTP and
# tells Ghost so via X-Forwarded-Proto. Ghost's url is https, so it answers
# every request with a 301 to https: a redirect loop. Override the header so
# Ghost knows the client is already on https. The proxy handles http->https.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: blog-https
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: https
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: default-blog-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: blog.dennisek.se
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blog
                port: { number: 80 }
---
# Public uploads: the `blog` bucket, aliased to this hostname in Garage.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-static
spec:
  ingressClassName: traefik
  rules:
    - host: blog.static.dennisek.se
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: garage-web
                port: { number: 80 }
