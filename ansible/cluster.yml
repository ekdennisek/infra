---
# Bootstraps the kubeadm cluster on the Terraform-provisioned nodes.
# Safe to re-run: init/join are guarded by `creates:`, so existing nodes
# are untouched and a rebuilt node simply (re-)joins.
#
#   ansible-playbook cluster.yml

- name: Wait for provisioning to finish
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 600

    # Terraform returns as soon as the qemu agent is up, which is before
    # the vendor-data has finished installing kubeadm. Exit code 2 means
    # "done, with recoverable errors" (typically a transient apt hiccup).
    - name: Wait for cloud-init to complete
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init
      changed_when: false
      failed_when: cloud_init.rc not in [0, 2]

- name: Initialise control plane
  hosts: control_plane
  become: true
  vars:
    # Points at the first CP node for now; swap in a VIP/DNS name if you
    # ever go HA. Set from day one so adding CP nodes later is possible.
    control_plane_endpoint: "{{ hostvars[groups['control_plane'][0]].ansible_host }}:6443"
    # Passed both to kubeadm and to Calico's IP pool below. Must not
    # overlap the node network (10.130.0.0/16).
    pod_network_cidr: 10.250.0.0/16
    calico_version: v3.30.3
  tasks:
    - name: Run kubeadm init
      ansible.builtin.command: >
        kubeadm init
        --control-plane-endpoint={{ control_plane_endpoint }}
        --pod-network-cidr={{ pod_network_cidr }}
      args:
        creates: /etc/kubernetes/admin.conf

    # Since Calico v3.29 the operator CRDs ship separately from the
    # operator itself and must be applied first. The CRDs are too large
    # for client-side apply's last-applied annotation, so --server-side
    # is required (and makes re-runs safe, unlike kubectl create).
    - name: Install Calico operator CRDs
      ansible.builtin.command: >
        kubectl --kubeconfig /etc/kubernetes/admin.conf apply --server-side -f
        https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/operator-crds.yaml

    - name: Install Tigera operator (Calico)
      ansible.builtin.command: >
        kubectl --kubeconfig /etc/kubernetes/admin.conf apply --server-side -f
        https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/tigera-operator.yaml

    # CRD registration is asynchronous; applying the Installation before
    # the CRDs are Established fails with "no matches for kind".
    - name: Wait for Calico CRDs to be established
      ansible.builtin.command: >
        kubectl --kubeconfig /etc/kubernetes/admin.conf wait
        --for=condition=Established --timeout=90s
        crd/installations.operator.tigera.io crd/apiservers.operator.tigera.io
      changed_when: false

    - name: Write Calico installation manifest
      ansible.builtin.copy:
        dest: /root/calico-installation.yaml
        content: |
          apiVersion: operator.tigera.io/v1
          kind: Installation
          metadata:
            name: default
          spec:
            calicoNetwork:
              ipPools:
                - name: default-ipv4-ippool
                  blockSize: 26
                  cidr: {{ pod_network_cidr }}
                  encapsulation: VXLANCrossSubnet
                  natOutgoing: Enabled
                  nodeSelector: all()
          ---
          apiVersion: operator.tigera.io/v1
          kind: APIServer
          metadata:
            name: default
          spec: {}

    - name: Apply Calico installation
      ansible.builtin.command: >
        kubectl --kubeconfig /etc/kubernetes/admin.conf apply --server-side -f
        /root/calico-installation.yaml

    - name: Generate worker join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_cmd
      changed_when: false

    - name: Fetch kubeconfig
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ playbook_dir }}/kubeconfig"
        flat: true

- name: Join workers
  hosts: workers
  become: true
  tasks:
    - name: Join cluster
      ansible.builtin.command: "{{ hostvars[groups['control_plane'][0]].join_cmd.stdout }}"
      args:
        creates: /etc/kubernetes/kubelet.conf

- name: Install cluster add-ons
  hosts: control_plane
  become: true
  vars:
    metallb_version: v0.16.0
    # Reserved on the LAN for LoadBalancer services — keep out of DHCP scope.
    metallb_pool: 10.130.0.7-10.130.0.9
    helm_version: v3.19.4
    traefik_chart_version: 41.4.0 # Traefik v3.7.12
    argocd_chart_version: 10.4.1 # Argo CD v3.5.2
    argocd_host: argocd.lab.local
    sealed_secrets_chart_version: 2.19.3 # controller v0.39.1
    # Argo CD syncs the k8s/ directory of this repo; the repo must be
    # reachable from the cluster (public, or add a repo credential secret).
    gitops_repo: https://github.com/ekdennisek/infra.git
  tasks:
    - name: Install MetalLB
      ansible.builtin.command: >
        kubectl --kubeconfig /etc/kubernetes/admin.conf apply --server-side -f
        https://raw.githubusercontent.com/metallb/metallb/{{ metallb_version }}/config/manifests/metallb-native.yaml

    # The IPAddressPool/L2Advertisement CRs are validated by a webhook served
    # by this controller; applying them before it's up fails with
    # connection refused.
    - name: Wait for MetalLB controller
      ansible.builtin.command: >
        kubectl --kubeconfig /etc/kubernetes/admin.conf wait
        -n metallb-system --for=condition=Available --timeout=180s
        deploy/controller
      changed_when: false

    - name: Write MetalLB address pool manifest
      ansible.builtin.copy:
        dest: /root/metallb-pool.yaml
        content: |
          apiVersion: metallb.io/v1beta1
          kind: IPAddressPool
          metadata:
            name: default-pool
            namespace: metallb-system
          spec:
            addresses:
              - {{ metallb_pool }}
          ---
          apiVersion: metallb.io/v1beta1
          kind: L2Advertisement
          metadata:
            name: default
            namespace: metallb-system
          spec:
            ipAddressPools:
              - default-pool

    # Retries because the webhook's endpoints can lag a moment behind the
    # deployment turning Available.
    - name: Apply MetalLB address pool
      ansible.builtin.command: >
        kubectl --kubeconfig /etc/kubernetes/admin.conf apply --server-side -f
        /root/metallb-pool.yaml
      register: pool_apply
      until: pool_apply.rc == 0
      retries: 6
      delay: 5

    # Traefik is helm-only upstream, so put helm on the control plane.
    - name: Download helm
      ansible.builtin.get_url:
        url: https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz
        dest: /root/helm-{{ helm_version }}.tar.gz
        mode: "0644"

    - name: Unpack helm
      ansible.builtin.unarchive:
        src: /root/helm-{{ helm_version }}.tar.gz
        dest: /usr/local/bin
        remote_src: true
        extra_opts: ["--strip-components=1", "linux-amd64/helm"]
        creates: /usr/local/bin/helm

    - name: Add Traefik chart repo
      ansible.builtin.command: helm repo add traefik https://traefik.github.io/charts --force-update
      changed_when: false

    - name: Update chart repo
      ansible.builtin.command: helm repo update traefik
      changed_when: false

    - name: Write Traefik values
      ansible.builtin.copy:
        dest: /root/traefik-values.yaml
        content: |
          service:
            type: LoadBalancer  # IP comes from the MetalLB pool

    # upgrade --install is idempotent; helm bumps the release revision on
    # every run, which is cosmetic.
    - name: Install Traefik
      ansible.builtin.command: >
        helm upgrade --install traefik traefik/traefik
        --kubeconfig /etc/kubernetes/admin.conf
        --namespace traefik --create-namespace
        --version {{ traefik_chart_version }}
        -f /root/traefik-values.yaml

    - name: Add Argo chart repo
      ansible.builtin.command: helm repo add argo https://argoproj.github.io/argo-helm --force-update
      changed_when: false

    - name: Update Argo chart repo
      ansible.builtin.command: helm repo update argo
      changed_when: false

    - name: Write Argo CD values
      ansible.builtin.copy:
        dest: /root/argocd-values.yaml
        content: |
          global:
            domain: {{ argocd_host }}
          configs:
            params:
              # Argo CD terminates its own TLS by default; behind Traefik's
              # plain-HTTP entrypoint that causes a redirect loop. Serve
              # plain HTTP and let Traefik front it.
              server.insecure: true
          server:
            ingress:
              enabled: true
              ingressClassName: traefik

    - name: Install Argo CD
      ansible.builtin.command: >
        helm upgrade --install argocd argo/argo-cd
        --kubeconfig /etc/kubernetes/admin.conf
        --namespace argocd --create-namespace
        --version {{ argocd_chart_version }}
        -f /root/argocd-values.yaml

    - name: Wait for Argo CD server
      ansible.builtin.command: >
        kubectl --kubeconfig /etc/kubernetes/admin.conf wait
        -n argocd --for=condition=Available --timeout=300s
        deploy/argocd-server
      changed_when: false

    # The root Application: Argo CD continuously syncs everything under
    # k8s/ in the repo to the cluster. Deploying an app = pushing to git.
    - name: Write root Application manifest
      ansible.builtin.copy:
        dest: /root/argocd-apps.yaml
        content: |
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: apps
            namespace: argocd
          spec:
            project: default
            source:
              repoURL: {{ gitops_repo }}
              targetRevision: HEAD
              path: k8s
              directory:
                recurse: true
            destination:
              server: https://kubernetes.default.svc
              namespace: default
            syncPolicy:
              automated:
                prune: true
                selfHeal: true

    - name: Apply root Application
      ansible.builtin.command: >
        kubectl --kubeconfig /etc/kubernetes/admin.conf apply --server-side -f
        /root/argocd-apps.yaml

    - name: Read initial admin password
      ansible.builtin.command: >
        kubectl --kubeconfig /etc/kubernetes/admin.conf get secret
        -n argocd argocd-initial-admin-secret -o jsonpath={.data.password}
      register: argocd_pw
      changed_when: false

    - name: How to log in to Argo CD
      ansible.builtin.debug:
        msg: >-
          Argo CD is at http://{{ argocd_host }}/ now.
          Log in as admin / {{ argocd_pw.stdout | b64decode }}
          and change the password.

    # Sealed Secrets: encrypted secrets that are safe to commit to the
    # public repo; the controller decrypts them in-cluster.
    - name: Check for a sealing key backup
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/sealed-secrets-key.yaml"
      delegate_to: localhost
      become: false
      register: sealing_key_backup

    # Restoring the key BEFORE the controller starts means SealedSecrets
    # committed before a cluster rebuild stay decryptable.
    - name: Restore sealing key from backup
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/sealed-secrets-key.yaml"
        dest: /root/sealed-secrets-key.yaml
        mode: "0600"
      when: sealing_key_backup.stat.exists

    - name: Apply restored sealing key
      ansible.builtin.command: >
        kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f
        /root/sealed-secrets-key.yaml
      when: sealing_key_backup.stat.exists

    - name: Add sealed-secrets chart repo
      ansible.builtin.command: >
        helm repo add sealed-secrets https://bitnami.github.io/sealed-secrets
        --force-update
      changed_when: false

    - name: Update sealed-secrets chart repo
      ansible.builtin.command: helm repo update sealed-secrets
      changed_when: false

    # fullnameOverride matters: kubeseal's defaults look for a controller
    # named sealed-secrets-controller in kube-system; without it every
    # kubeseal invocation needs --controller-name/--controller-namespace.
    - name: Install sealed-secrets controller
      ansible.builtin.command: >
        helm upgrade --install sealed-secrets sealed-secrets/sealed-secrets
        --kubeconfig /etc/kubernetes/admin.conf
        --namespace kube-system
        --version {{ sealed_secrets_chart_version }}
        --set fullnameOverride=sealed-secrets-controller

    - name: Wait for sealed-secrets controller
      ansible.builtin.command: >
        kubectl --kubeconfig /etc/kubernetes/admin.conf wait
        -n kube-system --for=condition=Available --timeout=180s
        deploy/sealed-secrets-controller
      changed_when: false

    - name: Read sealing key
      ansible.builtin.command: >
        kubectl --kubeconfig /etc/kubernetes/admin.conf get secret
        -n kube-system -l sealedsecrets.bitnami.com/sealed-secrets-key
        -o yaml
      register: sealing_key
      changed_when: false

    # The key decrypts every sealed secret — the backup lands next to the
    # kubeconfig, is gitignored, and must be kept safe.
    - name: Back up sealing key
      ansible.builtin.copy:
        content: "{{ sealing_key.stdout }}"
        dest: "{{ playbook_dir }}/sealed-secrets-key.yaml"
        mode: "0600"
      delegate_to: localhost
      become: false
