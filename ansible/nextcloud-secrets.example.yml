---
# Copy to nextcloud-secrets.yml (gitignored) and fill in. Read by
# nextcloud.yml. The Euro-Office JWT secret is not here: it is generated on
# the VM at first run.

# Password of the `nextcloud` role on the external PostgreSQL server.
db_password: ""

# First Nextcloud admin account, created at install time only.
nextcloud_admin_user: admin
nextcloud_admin_password: ""

# Garage key with read/write/owner on the `nextcloud` bucket (README
# "Object storage").
s3_access_key: GK...
s3_secret_key: ""
